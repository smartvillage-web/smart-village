<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Village – राह भारत को विश्व गुरु बनाने की</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:linear-gradient(135deg,#e8f5e9,#e3f2fd);
  color:#17351f;
}

header{
  background:linear-gradient(135deg,#087f23,#16a34a,#0ea5a5);
  color:white;
  text-align:center;
  padding:55px 20px;
}

header h1{
  font-size:38px;
  margin:0 0 15px;
}

header p{
  font-size:20px;
  margin:8px 0;
}

.container{
  max-width:900px;
  margin:auto;
  padding:25px 18px;
}

.card{
  background:white;
  margin:22px 0;
  padding:28px;
  border-radius:22px;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.hero{
  text-align:center;
}

.icon{
  font-size:70px;
  margin-bottom:10px;
}

h2{
  color:#087f23;
  font-size:28px;
}

.features{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}

.feature{
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  border-radius:16px;
  padding:20px;
  text-align:center;
  font-size:18px;
}

.price{
  text-align:center;
  font-size:42px;
  font-weight:bold;
  color:#7c3aed;
  margin:20px 0;
}

.buy{
  display:block;
  width:100%;
  max-width:420px;
  margin:20px auto;
  padding:18px;
  background:linear-gradient(135deg,#7c3aed,#5b21b6);
  color:white;
  text-decoration:none;
  text-align:center;
  border-radius:14px;
  font-size:22px;
  font-weight:bold;
  box-shadow:0 7px 18px rgba(91,33,182,.3);
}

.buy:hover{
  transform:scale(1.02);
}

.note{
  text-align:center;
  color:#555;
  font-size:14px;
}

footer{
  text-align:center;
  background:#12351d;
  color:white;
  padding:25px;
  margin-top:30px;
}
</style>
</head>

<body>

<header>
  <div class="icon">🌱🏡📱</div>
  <h1>Smart Village</h1>
  <p>राह भारत को विश्व गुरु बनाने की</p>
  <p>Clean • Green • Self-Reliant India</p>
</header>

<div class="container">

  <div class="card hero">
    <h2>स्मार्ट विलेज ई-बुक</h2>

    <p>
      भारत के गांवों को आधुनिक, आत्मनिर्भर, स्वच्छ और
      तकनीकी रूप से सक्षम बनाने की
